[package]
name = "nmt_terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["wayland", "x11"]
# Legacy cell-atlas graphics (sixel / iTerm2 inline images). Off by default: the
# libghostty-vt engine owns image protocols now, so these modules are dead code
# retained behind a gate because downstream users may still opt into the legacy path.
sixel = []
x11 = [
    "copypasta/x11"
]
wayland = [
    "copypasta/wayland",
]

[dependencies]
libghostty-vt-sys.workspace = true
nmt_config.workspace = true
nmt_platform.workspace = true

base64.workspace = true
bitflags.workspace = true
bytemuck.workspace = true
copypasta.workspace = true
cursor-icon.workspace = true
dirs.workspace = true
flate2.workspace = true
image_rs.workspace = true
lazy_static.workspace = true
libc.workspace = true
memchr.workspace = true
onig.workspace = true
parking_lot.workspace = true
rapidhash.workspace = true
raw-window-handle.workspace = true
regex.workspace = true
rustc-hash.workspace = true
serde.workspace = true
simdutf.workspace = true
smallvec.workspace = true
toml.workspace = true
tracing.workspace = true
unicode-width.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
