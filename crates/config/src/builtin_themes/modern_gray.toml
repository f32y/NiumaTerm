name = "Modern Gray"
mode = "light"

# VS Code "Light 2026" gray surfaces with its muted brown chrome accent.
#
# Every color the component library reads is named here so no control falls
# back to the library's own light defaults, which are white-surfaced and
# blue-accented. The derived families follow the palette already established
# above: buttons reuse the secondary ramp, semantic buttons are solid fills of
# their status color, and list, table, and skeleton surfaces reuse the
# black-alpha interaction fills. Corner radii stay unset so the application's
# own radii apply.

[colors.terminal]
background = "#E0E0E0"
foreground = "#292929"
cursor = "#383838"
vi-cursor = "#5E2BB4"
selection-background = "#BDBDBD"
