name = "Warm Light"
mode = "light"

# A warm paper palette: an off-white canvas (#FCFBFA) over a clay-tinted panel
# (#F7F4F1), with pure-white cards floating on both. Chrome is neutralised so
# nothing competes with the conversation; the one saturated colour is the
# terracotta accent (#B4552D), which marks the primary action and nothing else.
# Semantics stay legible against the warm ground: green #2E7D4F for success,
# rust #BA4A2A for failure, amber #D9822B for work in flight.
#
# Every color the component library reads is named here so no control falls
# back to the library's own light defaults, whose neutral gray would cool the
# warm ground. The derived families follow the palette already established
# above: buttons reuse the secondary ramp, semantic buttons are solid fills of
# their status color, and a selected row keeps this theme's floating-white-card
# idiom rather than an alpha fill. Corner radii stay unset so the application's
# own radii apply.

