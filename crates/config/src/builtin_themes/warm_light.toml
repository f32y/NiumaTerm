name = "Warm Light"
mode = "light"

# A warm paper palette: an off-white canvas (#FCFBFA) over a clay-tinted panel
# (#F7F4F1), with pure-white cards floating on both. Chrome is neutralised so
# nothing competes with the conversation; the one saturated colour is the
# terracotta accent (#B4552D), which marks the primary action and nothing else.
# Semantics stay legible against the warm ground: green #2E7D4F for success,
# rust #BA4A2A for failure, amber #D9822B for work in flight.

[colors.terminal]
background = "#FCFBFA"
foreground = "#1F1D1B"
cursor = "#B4552D"
vi-cursor = "#D9822B"
selection-background = "#E4D9CF"
selection-foreground = "#1F1D1B"
black = "#3D3936"
red = "#BA4A2A"
green = "#2E7D4F"
yellow = "#9A6B12"
blue = "#3C6098"
magenta = "#8C4E82"
cyan = "#25727A"
white = "#6E6862"
light-black = "#6E6862"
light-red = "#D2603E"
light-green = "#3E9663"
light-yellow = "#D9822B"
light-blue = "#4E77B4"
light-magenta = "#A5619A"
light-cyan = "#328A93"
light-white = "#9C948C"
tabs = "#F7F4F1"
tabs-active = "#FCFBFA"
tab-border = "#E7E1DB"
bar = "#F7F4F1"
split = "#E7E1DB"
