name = "Fluent Dark"
mode = "dark"

# WinUI 3 / Fluent 2 dark tokens. Chrome sits on SolidBackgroundFillColorBase
# (#202020) and content on the layer above it (#282828), which is the layering
# Windows 11 apps use so a Mica backdrop reads through the chrome only.
# Interaction states are the ControlFill ramp (default 6% / secondary 8% /
# tertiary 3% white), so they hold on any surface underneath.
# Accent is the Windows default blue at its dark-theme shade (#60CDFF).
# Terminal cells use the Campbell palette that ships with Windows.

[colors.terminal]
background = "#1C1C1C"
foreground = "#CCCCCC"
cursor = "#FFFFFF"
vi-cursor = "#60CDFF"
selection-background = "#005FB8"
selection-foreground = "#FFFFFF"
black = "#0C0C0C"
red = "#C50F1F"
green = "#13A10E"
yellow = "#C19C00"
blue = "#0037DA"
magenta = "#881798"
cyan = "#3A96DD"
white = "#CCCCCC"
light-black = "#767676"
light-red = "#E74856"
light-green = "#16C60C"
