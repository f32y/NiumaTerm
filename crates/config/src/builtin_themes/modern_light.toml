name = "Modern Light"
mode = "light"

# VS Code "2026 Light" palette: single-color chrome (#FAFAFD) with a pure-white
# terminal content layer; interaction states are foreground-alpha fills; the
# accent blue is #0069CC.

[colors.terminal]
background = "#FFFFFF"
foreground = "#202020"
cursor = "#202020"
vi-cursor = "#0069CC"
selection-background = "#ADD6FF"
selection-foreground = "#000000"
black = "#000000"
red = "#CD3131"
green = "#00BC00"
yellow = "#949800"
blue = "#0451A5"
magenta = "#BC05BC"
cyan = "#0598BC"
white = "#555555"
light-black = "#666666"
light-red = "#CD3131"
light-green = "#14CE14"
light-yellow = "#B5BA00"
light-blue = "#0451A5"
light-magenta = "#BC05BC"
light-cyan = "#0598BC"
light-white = "#A5A5A5"
tabs = "#FAFAFD"
tabs-active = "#FFFFFF"
tab-border = "#E2E2E5"
bar = "#FAFAFD"
split = "#E2E2E5"
split-active = "#0069CC"

