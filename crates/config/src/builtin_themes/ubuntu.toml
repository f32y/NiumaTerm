name = "Ubuntu"
mode = "dark"

# Ubuntu identity (aubergine surfaces, orange accent) on the modern layer
# system: one chrome base color, an elevated sidebar card, a distinct terminal
# content layer, and foreground-alpha interaction states.
#
# Every color the component library reads is named here so no control falls
# back to the library's own dark defaults, which are neutral gray and would
# break the aubergine cast. The derived families follow the palette already
# established above: buttons reuse the secondary ramp, semantic buttons are
# solid fills of their status color, and list, table, and skeleton surfaces
# reuse the white-alpha interaction fills. Corner radii stay unset so the
# application's own radii apply.

