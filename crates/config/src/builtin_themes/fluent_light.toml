name = "Fluent Light"
mode = "light"

# WinUI 3 / Fluent 2 light tokens. Chrome sits on SolidBackgroundFillColorBase
# (#F3F3F3) and content on the card layer above it (#FAFAFA), which is the
# layering Windows 11 apps use so a Mica backdrop reads through the chrome only.
# Interaction states are the ControlFill ramp (translucent white over the
# surface) plus the SubtleFill ramp (translucent black) for list and menu rows.
# Accent is the Windows default blue at its light-theme shade (#005FB8).

[colors.terminal]
background = "#FFFFFF"
foreground = "#383A42"
cursor = "#005FB8"
vi-cursor = "#005FB8"
selection-background = "#CCE4F7"
selection-foreground = "#000000"
black = "#383A42"
red = "#C42B1C"
