yellow = "#9D5D00"
blue = "#0184BC"
magenta = "#A626A4"
cyan = "#0997B3"
white = "#FAFAFA"
light-black = "#4F525D"
light-red = "#E06C75"
light-green = "#50A14F"
light-yellow = "#C18401"
light-blue = "#61AFEF"
