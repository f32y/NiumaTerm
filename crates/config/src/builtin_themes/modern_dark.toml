name = "Modern Dark"
mode = "dark"

# VS Code "2026 Dark" palette: single-color chrome (#191A1B) with a darker
# terminal content layer (#121314); interaction states are foreground-alpha
# fills so they hold on any surface; the accent blue is desaturated (#297AA0).
#
# Every color the component library reads is named here so no control falls
# back to the library's own dark defaults, which belong to a different palette.
# The derived families follow the palette already established above: buttons
# reuse the secondary ramp, semantic buttons are solid fills of their status
# color, and list, table, and skeleton surfaces reuse the white-alpha
# interaction fills. Corner radii stay unset so the application's own radii
# apply.

[colors.terminal]
background = "#121314"
foreground = "#D6D6D6"
cursor = "#D6D6D6"
vi-cursor = "#297AA0"
selection-background = "#264F78"
selection-foreground = "#FFFFFF"
black = "#000000"
red = "#CD3131"
green = "#0DBC79"
yellow = "#E5E510"
blue = "#2472C8"
magenta = "#BC3FBC"
cyan = "#11A8CD"
white = "#E5E5E5"
light-black = "#666666"
light-red = "#F14C4C"
light-green = "#23D18B"
light-yellow = "#F5F543"
light-blue = "#3B8EEA"
