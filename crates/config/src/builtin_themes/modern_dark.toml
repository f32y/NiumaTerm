name = "Modern Dark"
mode = "dark"

# VS Code "2026 Dark" palette: single-color chrome (#191A1B) with a darker
# terminal content layer (#121314); interaction states are foreground-alpha
# fills so they hold on any surface; the accent blue is desaturated (#297AA0).

[colors.terminal]
background = "#121314"
foreground = "#D6D6D6"
cursor = "#D6D6D6"
vi-cursor = "#297AA0"
selection-background = "#264F78"
selection-foreground = "#FFFFFF"
black = "#000000"
red = "#CD3131"
green = "#0DBC79"
yellow = "#E5E510"
blue = "#2472C8"
magenta = "#BC3FBC"
cyan = "#11A8CD"
white = "#E5E5E5"
light-black = "#666666"
light-red = "#F14C4C"
light-green = "#23D18B"
light-yellow = "#F5F543"
light-blue = "#3B8EEA"
light-magenta = "#D670D6"
light-cyan = "#29B8DB"
light-white = "#E5E5E5"
tabs = "#191A1B"
tabs-active = "#121314"
tab-border = "#2A2B2C"
bar = "#191A1B"
split = "#2A2B2C"
split-active = "#297AA0"

