parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[build-dependencies]
nmt_version.workspace = true
winres.workspace = true

[target.'cfg(windows)'.dependencies]
nmt_remote_net.workspace = true
anyhow.workspace = true
base64.workspace = true
serde.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
notify.workspace = true
serde_json.workspace = true
semver.workspace = true
toml.workspace = true
gpui.workspace = true
gpui-component.workspace = true
lsp-types.workspace = true
gpui-component-assets.workspace = true
rust-embed.workspace = true
gpui_windows.workspace = true
nmt_input.workspace = true
# Kitty graphics: construct GPUI `RenderImage` frames from decoded pixels. Same
# crate/version GPUI links, so `image_rs::Frame` unifies with `gpui`'s `Frame`.
image_rs.workspace = true

reqwest = { workspace = true, features = [
    "blocking",
    "rustls-tls-native-roots",
    "system-proxy",
] }
percent-encoding.workspace = true
raw-window-handle.workspace = true
sha2.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tokio.workspace = true
