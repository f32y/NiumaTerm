[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "NiumaTerm"
path = "src/main.rs"

[dependencies]
unicode-width.workspace = true
nmt_profiling.workspace = true
nmt_agent.workspace = true
nmt_config.workspace = true
nmt_input.workspace = true
nmt_terminal.workspace = true
nmt_platform.workspace = true
nmt_runtime.workspace = true
nmt_updater.workspace = true

dirs.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

anyhow.workspace = true
serde.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
notify.workspace = true
serde_json.workspace = true
semver.workspace = true
toml.workspace = true
gpui.workspace = true
gpui_tokio.workspace = true
tokio.workspace = true
gpui-component.workspace = true
gpui-kit-assets.workspace = true
rust-embed.workspace = true
# Kitty graphics: construct GPUI `RenderImage` frames from decoded pixels. Same
# crate/version GPUI links, so `image_rs::Frame` unifies with `gpui`'s `Frame`.
image_rs.workspace = true

percent-encoding.workspace = true
tree-sitter.workspace = true
tree-sitter-language.workspace = true
gpui-base.workspace = true
ropey.workspace = true
vte.workspace = true
uuid.workspace = true
rust-i18n.workspace = true
rand.workspace = true

[build-dependencies]
nmt_version.workspace = true
winres.workspace = true

# The GPUI backend is the one thing that cannot be shared: each names its own
# platform type, and the application picks one to hand `Application::with_platform`.
[target.'cfg(windows)'.dependencies]
gpui_windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
# The same font source GPUI's text system selects families through, so a
# default face can be checked against what the host actually has.
font-kit.workspace = true
nmt_agent = { workspace = true, features = ["test-support"] }
tree-sitter-bash.workspace = true
tree-sitter-diff.workspace = true
tree-sitter-powershell.workspace = true
tree-sitter-rust.workspace = true
nmt_terminal = { workspace = true, features = ["test-support"] }
