[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "NiumaTerm"
path = "src/main.rs"

[dependencies]
nmt_agent_utils.workspace = true
nmt_app_terminal.workspace = true
nmt_config.workspace = true
nmt_i18n.workspace = true
nmt_terminal.workspace = true
nmt_platform.workspace = true
nmt_version.workspace = true

