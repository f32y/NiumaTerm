[package]
name = "nmt_terminal_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
nmt_agent.workspace = true
nmt_config.workspace = true
nmt_i18n.workspace = true
nmt_input.workspace = true
nmt_platform.workspace = true
nmt_terminal.workspace = true

futures.workspace = true
gpui.workspace = true
gpui-component.workspace = true
# Kitty graphics: construct GPUI `RenderImage` frames from decoded pixels. Same
# crate/version GPUI links, so `image_rs::Frame` unifies with `gpui`'s `Frame`.
image_rs.workspace = true
parking_lot.workspace = true
tracing.workspace = true

[dev-dependencies]
nmt_remote_net.workspace = true
gpui = { workspace = true, features = ["test-support"] }
tokio.workspace = true

# The full-frame profile needs a concrete GPUI platform for its real text
# system, so it takes the backend of the host it profiles.
[target.'cfg(windows)'.dev-dependencies]
gpui_windows.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_macos.workspace = true
