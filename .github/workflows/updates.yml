name: Update metadata

on:
  workflow_call:
    inputs:
      label:
        description: Release tag, which is also the version label
        type: string
        required: true
      bundle-version:
        description: The CFBundleVersion the published build carries
        type: string
        default: ''
      channel:
        description: Sparkle channel; empty for stable
        type: string
        required: true
      asset:
        description: Published macOS archive; empty to preserve the appcast
        type: string
        default: ''
      length:
        description: Size of that archive in bytes
        type: string
        default: ''
      signature:
        description: Its EdDSA signature
        type: string
        default: ''
    secrets:
      cloudflare-api-token:
        description: Token with Workers Scripts edit rights on the account
        required: true

# Both updaters read what this publishes, from the niumaterm-updates Worker:
# Sparkle takes the appcast at /appcast.xml, and the Windows updater takes the
# release manifests under /windows. Each address is stamped into every build
# that ships and an installation only ever asks the one it was built with, so
# neither can move once a build carrying it is out.
#
# Each publish retains the appcast and renders the Windows list, because a
# Workers assets deploy replaces the whole set. Serialization prevents
# concurrent deployments from dropping each other's feed updates.
jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: update-metadata
      queue: max
      cancel-in-progress: false
    env:
      ASSETS: updates/public
      FEED_URL: https://niumaterm-updates.f32.io/appcast.xml
      # A deploy replaces the whole asset set, so everything served has to be
      # rebuilt here rather than kept in source control.
      FEED_PATH: updates/public/appcast.xml
      # Archives are named on the caching front rather than on GitHub directly,
      # so a client on a poor path to GitHub pays that cost once per cached
      # object instead of on every update.
      DOWNLOAD_BASE: https://niumaterm-downloads.f32.io
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the current feed
        run: |
          # 404 is the state before the first publish, and the generator starts
          # a new document from it. Any other status is a real failure: taking
          # one for "absent" would silently drop the published history and ship
          # a feed holding only the release this run adds.
          # A platform may have published moments ago; a unique query avoids
          # reading the cached feed from before that deployment.
          status=$(curl -sS -o "$FEED_PATH" -w '%{http_code}' \
            "$FEED_URL?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RANDOM")
          case "$status" in
            200) ;;
            404) rm -f "$FEED_PATH" ;;
            *)
              echo "unexpected status $status from $FEED_URL" >&2
              exit 1
              ;;
          esac

      - name: Render the appcast
        if: inputs.asset != ''
        run: |
          python3 scripts/update-appcast.py \
            --appcast "$FEED_PATH" \
            --label "$LABEL" \
            --bundle-version "$BUNDLE_VERSION" \
            --channel "$CHANNEL" \
            --url "$DOWNLOAD_BASE/$LABEL/$ASSET" \
            --page-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$LABEL" \
            --length "$LENGTH" \
            --signature "$SIGNATURE"
        env:
          LABEL: ${{ inputs.label }}
          BUNDLE_VERSION: ${{ inputs.bundle-version }}
          CHANNEL: ${{ inputs.channel }}
          ASSET: ${{ inputs.asset }}
          LENGTH: ${{ inputs.length }}
          SIGNATURE: ${{ inputs.signature }}

      # Projected from the API responses the Windows updater used to request
      # directly, keeping the field names its deserializer already reads. Only
      # the fields it looks at survive, so a release note or an uploader's
      # profile never ends up republished here. Drafts are dropped because the
      # tag of an unannounced version has no business on a public address.
      #
      # Asset URLs are rebuilt on the caching front, the digest along with the
      # archive it describes. Leaving the digest on GitHub would keep an update
      # dependent on reaching GitHub, which is the condition that front exists
      # to work around: the archive would arrive in seconds and the check behind
      # it would time out.
      - name: Render the Windows manifests
        env:
          GH_TOKEN: ${{ github.token }}
          ENTRY: |
            ("NiumaTerm-windows-x86_64-" + .tag_name + ".zip") as $archive
            | select(any(.assets[]; .name == $archive and .state == "uploaded"))
            | select(any(.assets[]; .name == ($archive + ".sha256") and .state == "uploaded"))
            | . as $release
            | {
                tag_name, html_url, draft, prerelease, published_at,
                assets: [
                  .assets[]
                  | { name, browser_download_url: "\($base)/\($release.tag_name)/\(.name)" }
                ]
              }
        run: |
          mkdir -p "$ASSETS/windows"
          # A macOS-only release cannot be installed on Windows. Read beyond
          # the first page so nightlies cannot hide the last usable stable
          # build, and require both the archive and its completed checksum.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq --arg base "$DOWNLOAD_BASE" "[.[][] | select(.draft | not) | $ENTRY]" \
              > "$RUNNER_TEMP/windows-releases.json"
          # An empty label is ignored by installed clients when no Windows
          # stable build has been published yet.
          jq 'map(select(.prerelease | not)) | .[0] // {tag_name: "", html_url: "", assets: []}' \
            "$RUNNER_TEMP/windows-releases.json" > "$ASSETS/windows/stable.json"
          jq '.[0:30]' "$RUNNER_TEMP/windows-releases.json" > "$ASSETS/windows/nightly.json"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Publish
        run: |
          npm ci
          npx wrangler deploy -c updates/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
