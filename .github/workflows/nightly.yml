name: Nightly build

on:
  workflow_dispatch:

jobs:
  name:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.name.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      # The date comes from the commit rather than the run, so rebuilding a
      # revision reproduces the name it was published under, and so a locally
      # built binary of the same revision carries the same version string.
      - id: name
        run: |
          date=$(git show -s --format=%cd --date=format:%Y%m%d "$GITHUB_SHA")
          commit=$(git rev-parse --short=7 "$GITHUB_SHA")
          echo "tag=nightly-$date-$commit" >> "$GITHUB_OUTPUT"

  package:
    needs: name
    uses: ./.github/workflows/windows-package.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.name.outputs.tag }}

  # Tagging runs after the build so a nightly tag only ever marks a revision
  # that actually produced a package.
  tag:
    needs: [name, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # The tag names the revision, so it collides only when the same revision
      # is built twice; forcing keeps that run from failing and leaves the tag
      # on the revision it already marked.
      - run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
        env:
          TAG: ${{ needs.name.outputs.tag }}

  release:
    needs: [name, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NiumaTerm-windows-x86_64-${{ needs.name.outputs.tag }}
          path: dist
      # A second run on the same revision reuses the tag, and gh refuses to
      # create a release for a tag that already has one; dropping the old
      # release republishes the newer package against that tag.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.name.outputs.tag }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$TAG" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --prerelease \
            --notes "Automated nightly build of $GITHUB_SHA."
