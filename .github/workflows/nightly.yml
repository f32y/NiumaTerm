name: Nightly build

on:
  workflow_dispatch:

jobs:
  name:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.name.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      # The date comes from the commit rather than the run, so rebuilding a
      # revision reproduces the name it was published under, and so a locally
      # built binary of the same revision carries the same version string.
      - id: name
        run: |
          date=$(git show -s --format=%cd --date=format:%Y%m%d "$GITHUB_SHA")
          commit=$(git rev-parse --short=7 "$GITHUB_SHA")
          echo "tag=nightly-$date-$commit" >> "$GITHUB_OUTPUT"

  package-windows:
    needs: name
    uses: ./.github/workflows/windows-package.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.name.outputs.tag }}

  package-macos:
    needs: name
    uses: ./.github/workflows/macos-package.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.name.outputs.tag }}
    # Signing and notarization need the certificate and App Store Connect
    # secrets, which a called workflow does not inherit on its own.
    secrets: inherit

  release-windows:
    needs: [name, package-windows]
    uses: ./.github/workflows/publish-package.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.name.outputs.tag }}
      artifact: NiumaTerm-windows-x86_64-${{ needs.name.outputs.tag }}
      prerelease: true

  release-macos:
    needs: [name, package-macos]
    uses: ./.github/workflows/publish-package.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.name.outputs.tag }}
      artifact: ${{ needs.package-macos.outputs.artifact }}
      prerelease: true

  updates-windows:
    needs: [name, release-windows]
    uses: ./.github/workflows/updates.yml
    with:
      label: ${{ needs.name.outputs.tag }}
      channel: nightly
    secrets:
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # After the release, because the metadata points at assets that have to be
  # downloadable by the time an updater reads it.
  updates-macos:
    needs: [name, package-macos, release-macos]
    uses: ./.github/workflows/updates.yml
    with:
      label: ${{ needs.name.outputs.tag }}
      bundle-version: ${{ needs.package-macos.outputs.bundle-version }}
      channel: nightly
      asset: ${{ needs.package-macos.outputs.asset }}
      length: ${{ needs.package-macos.outputs.length }}
      signature: ${{ needs.package-macos.outputs.ed-signature }}
    # Named one by one rather than inherited, so the signing and notarization
    # credentials this workflow also holds stay out of the called workflow.
    secrets:
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
