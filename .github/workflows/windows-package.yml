name: Windows package

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to build
        type: string
        required: true
      version:
        description: Version label used in the package and artifact name
        type: string
        required: true

jobs:
  package:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      # Stamps the linked outputs with the HEAD commit time, so a package's file
      # timestamps identify the revision instead of the runner's clock. Only the
      # last-write time survives Copy-Item and Compress-Archive; creation time is
      # reassigned by the copy and again by whoever extracts the archive.
      - name: Build
        shell: pwsh
        env:
          NIUMATERM_VERSION: ${{ inputs.version }}
        run: ./scripts/build.ps1 --release --locked

      - name: Package
        shell: pwsh
        run: |
          $packageName = "NiumaTerm-windows-x86_64-${{ inputs.version }}"
          "PACKAGE_NAME=$packageName" >> $env:GITHUB_ENV
          $package = "dist/$packageName"

          New-Item -ItemType Directory -Force $package

          Copy-Item @(
            "target/release/NiumaTerm.exe",
            "target/release/NiumaTermHook.exe",
            "target/release/shell_extension.dll",
            "target/release/conpty.dll",
            "target/release/OpenConsole.exe"
          ) $package

          Compress-Archive `
            -Path "$package/*" `
            -DestinationPath "$package.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: dist/${{ env.PACKAGE_NAME }}.zip
