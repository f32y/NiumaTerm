name: Windows package

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to build
        type: string
        required: true
      version:
        description: Version label used in the package and artifact name
        type: string
        required: true

jobs:
  package:
    runs-on: windows-latest

    steps:
      # The shell extension is versioned by the revision that last changed it,
      # which a shallow checkout cannot report.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          # Every release bumps the workspace version, which rewrites Cargo.lock
          # and therefore the exact key, so without a prefix fallback each build
          # started from an empty target/ and reuploaded a fresh 1.2 GB cache.
          # The prefix restores the previous build's target/ and registry, and
          # the lockfile in the key still forces a new save whenever a
          # dependency changes.
          restore-keys: ${{ runner.os }}-cargo-release-

      # Stamps the linked outputs with the HEAD commit time, so a package's file
      # timestamps identify the revision instead of the runner's clock. Only the
      # last-write time survives Copy-Item and Compress-Archive; creation time is
      # reassigned by the copy and again by whoever extracts the archive.
      - name: Build
        shell: pwsh
        env:
          NIUMATERM_VERSION: ${{ inputs.version }}
        run: ./scripts/build.ps1 --release --locked

      - name: Package
        shell: pwsh
        run: |
          $packageName = "NiumaTerm-windows-x86_64-${{ inputs.version }}"
          "PACKAGE_NAME=$packageName" >> $env:GITHUB_ENV
          $package = "dist/$packageName"

          New-Item -ItemType Directory -Force $package

          Copy-Item @(
            "target/release/NiumaTerm.exe",
            "target/release/NiumaTermHook.exe",
            "target/release/shell_extension.dll",
            "target/release/conpty.dll",
            "target/release/OpenConsole.exe"
          ) $package

          Compress-Archive `
            -Path "$package/*" `
            -DestinationPath "$package.zip"

          # A downloader has no other way to tell a truncated or tampered
          # package from a complete one before it starts replacing installed
          # files. The sha256sum layout, lowercase digest and two spaces before
          # the name, is what `sha256sum -c` reads; the line terminator is
          # written explicitly because the CRLF this Windows runner would
          # otherwise append becomes part of the name that tool looks up.
          $digest = (Get-FileHash "$package.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content `
            -Path "$package.zip.sha256" `
            -Value "$digest  $packageName.zip`n" `
            -Encoding ascii `
            -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            dist/${{ env.PACKAGE_NAME }}.zip
            dist/${{ env.PACKAGE_NAME }}.zip.sha256
