name: Windows package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $packageName = "NiumaTerm-windows-x86_64-$(Get-Date -Format yyyyMMdd)"
          "PACKAGE_NAME=$packageName" >> $env:GITHUB_ENV
          $package = "dist/$packageName"

          New-Item -ItemType Directory -Force $package

          Copy-Item @(
            "target/release/NiumaTerm.exe",
            "target/release/NiumaTermHook.exe",
            "target/release/shell_extension.dll",
            "target/release/conpty.dll",
            "target/release/OpenConsole.exe"
          ) $package

          Copy-Item "target/release/assets" $package -Recurse

          Compress-Archive `
            -Path "$package/*" `
            -DestinationPath "$package.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "build-${{ github.run_number }}"
          "dist/${{ env.PACKAGE_NAME }}.zip"
          --title "${{ env.PACKAGE_NAME }}"
          --target "${{ github.sha }}"
          --generate-notes
