[workspace.package]
version = "1.2.5"
publish = false
authors = ["f32y <nyhvec@gmail.com>"]
edition = "2024"
license = "MIT"
rust-version = "1.96.0"

[workspace]
resolver = "3"
members = [
    "crates/agent_utils",
    "crates/agent_hook_cli",
    "crates/app",
    "crates/version",
    "crates/config",
    "crates/i18n",
    "crates/input",
    "crates/platform",
    "crates/remote_net",
    "crates/remote_session_hub",
    "crates/shell_extension",
    "crates/terminal",
    
    "third_party/libghostty-vt-sys",

    # GPUI fork
    "third_party/gpui/collections",
    "third_party/gpui/gpui",
    "third_party/gpui/gpui_linux",
    "third_party/gpui/gpui_macos",
    "third_party/gpui/gpui_macros",
    "third_party/gpui/gpui_platform",
    "third_party/gpui/gpui_util",
    "third_party/gpui/gpui_web",
    "third_party/gpui/gpui_wgpu",
    "third_party/gpui/gpui_windows",
    "third_party/gpui/gpui_shared_string",
    "third_party/gpui/media",
    "third_party/gpui/refineable",
    "third_party/gpui/refineable/derive_refineable",
    "third_party/gpui/scheduler",
    "third_party/gpui/sum_tree",
    "third_party/gpui/util_macros",

    # gpui-component fork
    "third_party/gpui-component/assets",
    "third_party/gpui-component/macros",
    "third_party/gpui-component/ui",
]
default-members = [
    "crates/agent_hook_cli",
    "crates/app",
    "crates/remote_session_hub",
    "crates/shell_extension",
]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)"] }

[workspace.lints.clippy]
# Style/pedantic noise stays off, but blanket-allowing `all` also silenced the
# correctness and suspicious groups (deny/warn by default); restore those.
all = { level = "allow", priority = -2 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
disallowed_types = "deny"

[workspace.dependencies]
nmt_agent_utils = { path = "crates/agent_utils" }
nmt_version = { path = "crates/version" }
nmt_config = { path = "crates/config" }
nmt_i18n = { path = "crates/i18n" }
nmt_input = { path = "crates/input" }
libghostty-vt-sys = { path = "third_party/libghostty-vt-sys" }
nmt_platform = { path = "crates/platform" }
nmt_remote_net = { path = "crates/remote_net" }
nmt_remote_session_hub = { path = "crates/remote_session_hub" }
nmt_terminal = { path = "crates/terminal" }

# Agent profile credential encryption. The aes-gcm `getrandom` default
# feature provides the operating-system random source used for nonces.
# base64 is declared in the GPUI Component section below.
aes-gcm = "0.10"

# Remote session wire protocol
base32 = "0.5"
postcard = { version = "1", features = ["use-std"] }
sha2 = "0.10"
snow = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# GPUI fork
collections = { path = "third_party/gpui/collections" }
gpui = { path = "third_party/gpui/gpui" }
gpui_linux = { path = "third_party/gpui/gpui_linux" }
gpui_macos = { path = "third_party/gpui/gpui_macos" }
gpui_macros = { path = "third_party/gpui/gpui_macros" }
gpui_media = { path = "third_party/gpui/media" }
gpui_platform = { path = "third_party/gpui/gpui_platform" }
gpui_util = { path = "third_party/gpui/gpui_util" }
gpui_web = { path = "third_party/gpui/gpui_web" }
gpui_wgpu = { path = "third_party/gpui/gpui_wgpu" }
gpui_windows = { path = "third_party/gpui/gpui_windows" }
gpui_shared_string = { path = "third_party/gpui/gpui_shared_string" }
refineable = { path = "third_party/gpui/refineable" }
derive_refineable = { path = "third_party/gpui/refineable/derive_refineable" }
scheduler = { path = "third_party/gpui/scheduler" }
sum_tree = { path = "third_party/gpui/sum_tree" }
util_macros = { path = "third_party/gpui/util_macros" }

# gpui-component fork
# tree-sitter features power syntax highlighting in transcript code blocks
# and tool-call output (agent tabs).
gpui-component = { path = "third_party/gpui-component/ui", features = [
    "tree-sitter",
    "tree-sitter-languages",
] }
gpui-component-assets = { path = "third_party/gpui-component/assets" }
gpui-component-macros = { path = "third_party/gpui-component/macros" }

