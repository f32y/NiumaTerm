[profile.release]
strip = "symbols"
split-debuginfo = "packed"
debug = "full"
incremental = false
lto = "thin"
panic = "abort"

[profile.dev]
split-debuginfo = "unpacked"
lto = false
incremental = true
opt-level = 0
