# NiumaTerm - example configuration
#
# Every key below is shown with its built-in default, serialized from `Config`
# in `crates/config/src/lib.rs`. Copy this file to your config location and
# change only what you need; any key you omit falls back to the default here.
# Defaults reflect the Windows build.
#
# Not listed: `colors` and the resolved UI theme, which come from the theme
# named by `theme` rather than from this file (see `crates/config/src/theme`),
# and `working-dir`, which defaults to unset.
#
# `example_config_matches_the_serialized_defaults` in `crates/config` keeps
# everything below in step with the type; it prints the replacement body when
# it fails.

theme = "modern_dark"

[cursor]
shape = "Block"
blinking = false
blinking-interval = 800

[shell]
program = "powershell"
args = []

[editor]
program = "notepad"
args = []

[appearance]
input-style = "waterfall"
scroll-to-bottom-when-typing = true
agent-pane-use-terminal-background = false
command-blocks = true
show-daily-token-usage = false
show-git-status-on-title-bar = false
git-status-refresh-interval = 30
tab-width = 120.0
tab-auto-size = false
tab-bar-style = "horizontal"
ui-font = "Segoe UI"
terminal-font-family = "Consolas"
terminal-font-size = 14.0
terminal-line-height = 1.0
agent-font-family = "Consolas"
agent-font-size = 14.0
monospace-only = true
enable-window-transparency = "acrylic"
transparent-main-view = true
smooth-scrolling = "all"
background-opacity = 1.0
background-image-opacity = 0.3
language = "en"

[profiles]
default = ""
list = []

[agent-profiles]
default = ""
initialized = false
list = []

[agent]
enable-agent-hooks = true
show-agent-usage = true
collapse-tool-calls = false
check-agent-updates = true
codex-skill-command-compat = true

[system]
restore-last-session-when-opening = true
manage-subprocess-job = false
warn-before-terminating-shell = "when-child-processes-running"
confirm-before-closing-workspace = true
prioritize-ui-threads = false
newline-shortcut = "ctrl-enter"
open-in-best-workspace = true

[remote-session]
host-enabled = false
relay-url = ""
access-token = ""
